spring:
  main:
    web-application-type: servlet

  security:
    oauth2:
      client:
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            redirect-uri: ${KAKAO_LOGIN_REDIRECT_URI}
            authorization-grant-type: authorization_code
            client-authentication-method: POST
            client-name: Kakao
            scope: # 미정
              - name
              - account_email

  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/${DB_NAME:cuk_compasser}?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  cloud:
    aws:
      s3:
        bucket: ${S3_BUCKET_NAME}
      region:
        static: ap-northeast-2
      stack:
        auto: false
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}

management:
  endpoints:
    web:
      exposure:
        # Prometheus 수집을 위해 엔드포인트 노출
        include: prometheus, health, info
  metrics:
    tags:
      # Grafana 대시보드 필터링을 위한 레이블 설정
      application: compasser-api
  endpoint:
    health:
      show-details: always

logging:
  file:
    # Docker 컨테이너 내부 경로입니다.
    # docker-compose에서 이 경로를 호스트의 ./logs와 연결하게 됩니다.
    name: /var/log/compasser-api.log
  logback:
    rollingpolicy:
      # 운영 환경 로그 관리: 7일간 보관, 파일당 10MB 제한
      max-history: 7
      max-file-size: 10MB
  level:
    # 운영 환경은 로그 양을 조절하기 위해 보통 INFO 레벨을 사용합니다.
    root: INFO
    org.hibernate.SQL: ERROR