

spring:
  config:
    activate:
      on-profile: local

  main:
    web-application-type: servlet

  security:
    oauth2:
      client:
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            redirect-uri: ${KAKAO_LOGIN_REDIRECT_URI}
            authorization-grant-type: authorization_code
            client-authentication-method: POST
            client-name: Kakao
            scope: # 미정
              - name
              - account_email

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_NAME}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update   # 로컬 개발용
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: true   # 로컬에서는 허용

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # 🔕 로컬에서는 Redis 완전히 비활성화
  data:
    redis:
      repositories:
        enabled: false

  # ☁️ 로컬에서는 AWS 리소스 자동 구성 안 함
  cloud:
    aws:
      stack:
        auto: false
      region:
        static: ap-northeast-2
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      s3:
        bucket: ${S3_BUCKET_NAME}

# 🩺 Actuator Redis Health Check 비활성화
management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: prometheus

    prometheus:
      metrics:
        export:
          enabled: true
server:
  port: 8081

logging:
  file:
    name: logs/app.log
  logback:
    rollingpolicy:
      max-history: 7
      max-file-size: 10MB
jwt:
  security:
    key: ${JWT_SECRET_KEY}
