scrape_configs:
  - job_name: 'compasser-a-api'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      # spring boot app local에서 8080을 사용 중이라 8081을 사용
      - targets: ['host.docker.internal:8081']
        labels:
          application: 'compasser-api'
          env: 'local'