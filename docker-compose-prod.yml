services:
  app:
    image: shawn9272/cuk-compasser:${IMAGE_TAG}
    container_name: cuk-compasser-service
    restart: always
    env_file: .env
    environment:
      - DB_HOST=mysql-db
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - SPRING_PROFILES_ACTIVE=prod
      # application.yml의 변수명(${SPRING_DATA_REDIS_HOST})과 일치시킴
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      # JWT 및 카카오 설정 (환경변수로 주입)
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_LOGIN_REDIRECT_URI=${KAKAO_LOGIN_REDIRECT_URI}
      - KAKAO_LOCAL_BASE_URL=https://dapi.kakao.com
      - KAKAO_REST_API_KEY=${KAKAO_REST_API_KEY}
      - JAVA_TOOL_OPTIONS=-Xms256m -Xmx256m
      - KAKAO_JS_KEY=${KAKAO_JS_KEY}
      - KAKAOPAY_SECRET_KEY_DEV=${KAKAOPAY_SECRET_KEY_DEV}
      - NTS_SERVICE_KEY=${NTS_SERVICE_KEY}
    depends_on:
      mysql-db:
        condition: service_healthy
      redis:
        condition: service_started

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    volumes:
      - ./logs:/app/logs

    networks:
      - cuk-compasser-net

    deploy:
      resources:
        limits:
          memory: 400M

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443" # HTTPS 포트 개방
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      # ✨ 핵심: EC2 호스트의 인증서 폴더를 Nginx 컨테이너 내부로 연결 (읽기 전용: ro)
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
      - grafana
    networks:
      - cuk-compasser-net

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - cuk-compasser-net

  mysql-db:
    image: mysql:latest
    container_name: mysql-db
    restart: always
    env_file: .env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cuk-compasser-net
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u $$MYSQL_USER -p$$MYSQL_PASSWORD" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command:
      - --innodb_buffer_pool_size=128M # 데이터를 램에 올려두는 캐시 공간을 128MB로 제한
      - --max_connections=50           # 동시 접속자(커넥션) 수 50개로 제한
    deploy:
      resources:
        limits:
          memory: 300M                 # 컨테이너 전체 메모리 상한선

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "19090:9090"
    volumes:
      - ./prometheus/prometheus-prod.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - cuk-compasser-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_SERVER_DOMAIN=compasser.site
      - GF_SERVER_PROTOCOL=http
      - GF_SERVER_ROOT_URL=https://compasser.site/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - cuk-compasser-net

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: always
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - cuk-compasser-net

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: always
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml
      - ./logs:/var/log/spring-app:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    networks:
      - cuk-compasser-net

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  cuk-compasser-net:
    external: true